name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Version Info from version.json
        id: version_info
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName || '1.5'")
          VERSION_CODE=$(node -p "require('./version.json').versionCode || 6")
          CHANGELOG=$(node -p "require('./version.json').changelog || 'Peningkatan performa dan kestabilan kasir.'")
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Sync Web Assets to Android Project
        run: |
          node scripts/sync-android.js

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare Release APK Asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dialog-coffee-cashier-v${{ steps.version_info.outputs.version_name }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk dialog-coffee-cashier-release.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dialog-coffee-cashier-v${{ steps.version_info.outputs.version_name }}.apk
            dialog-coffee-cashier-release.apk
          name: DIALOG COFFEE Cashier ${{ github.ref_name }} (Build #${{ steps.version_info.outputs.version_code }})
          body: |
            Release resmi ${{ github.ref_name }} untuk aplikasi kasir DIALOG COFFEE Android.
            
            ### Catatan Rilis:
            ${{ steps.version_info.outputs.changelog }}
            
            ### Cara Install / Update:
            1. Unduh berkas **dialog-coffee-cashier-release.apk** di bawah.
            2. Buka dan instal pada perangkat Android kasir / barista.
            3. Seluruh data kasir dan pengaturan tersimpan aman tanpa terhapus.
          draft: false
          prerelease: false
