name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Sync Web Assets to Android Project
        run: |
          node scripts/sync-android.js
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare Release APK Asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dialog-coffee-cashier-release.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dialog-coffee-cashier-release.apk
          name: DIALOG COFFEE Cashier ${{ github.ref_name }}
          body: |
            Release resmi ${{ github.ref_name }} untuk aplikasi kasir DIALOG COFFEE Android.
            
            ### Cara Install / Update:
            1. Unduh berkas **dialog-coffee-cashier-release.apk** di bawah.
            2. Buka dan instal pada perangkat Android kasir / barista.
            3. Seluruh data kasir dan pengaturan tersimpan aman tanpa terhapus.
          draft: false
          prerelease: false
